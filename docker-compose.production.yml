# Docker Compose untuk Production Deployment
# Jalankan: docker compose -f docker-compose.production.yml up -d
# Backend membaca konfigurasi dari: backend/.env.production
# Menggunakan AWS RDS untuk PostgreSQL dan AWS S3 untuk storage
#
# PENTING: Menggunakan host network untuk S3 VPC Endpoint access
# Pastikan REDIS_URL=redis://localhost:6379 di .env.production

services:
  # Backend (Go) - reads from backend/.env.production
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host # Required for S3 VPC Endpoint access
    env_file:
      - ./backend/.env.production
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache (lokal di EC2)
  redis:
    image: redis:7-alpine
    network_mode: host # Must use host network to match backend
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
