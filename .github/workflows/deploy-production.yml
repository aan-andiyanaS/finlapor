# =====================================================
# Deploy to Production - Docker + Opsi B (Private Subnet via Bastion)
# =====================================================
# Workflow ini menggunakan:
# - Docker untuk backend + Redis
# - Deployment via Bastion Host (ProxyJump) ke Private Subnet
# - Build Docker image di GitHub Actions, transfer ke EC2
#
# Trigger: git tag v* (contoh: git tag v1.0.0 && git push origin v1.0.0)
# =====================================================

name: Deploy to Production (Docker + Bastion)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  DOCKER_IMAGE_NAME: finlapor-backend
  DOCKER_TAR_FILE: all-images.tar.gz

jobs:
  # =====================================================
  # Job 1: Build Docker Images
  # =====================================================
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend Docker image
        run: |
          echo "🔨 Building backend Docker image..."
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest ./backend
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.ref_name }} ./backend
      
      - name: Pull Redis image
        run: |
          echo "📦 Pulling Redis Alpine image..."
          docker pull redis:alpine
      
      - name: Save Docker images to tar
        run: |
          echo "💾 Saving Docker images to tar.gz..."
          docker save ${{ env.DOCKER_IMAGE_NAME }}:latest redis:alpine | gzip > ${{ env.DOCKER_TAR_FILE }}
          ls -lh ${{ env.DOCKER_TAR_FILE }}
      
      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: ${{ env.DOCKER_TAR_FILE }}
          retention-days: 1

  # =====================================================
  # Job 2: Deploy Backend via Bastion (Opsi B)
  # =====================================================
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build-docker]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Docker images artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images
      
      - name: Setup SSH Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BACKEND_HOST: ${{ secrets.BACKEND_PRIVATE_IP }}
        run: |
          echo "🔑 Setting up SSH keys..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add hosts to known_hosts
          ssh-keyscan -H $BASTION_HOST >> ~/.ssh/known_hosts 2>/dev/null
          
          # Create SSH config for ProxyJump
          cat >> ~/.ssh/config << EOF
          Host bastion
              HostName $BASTION_HOST
              User ubuntu
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
          
          Host backend
              HostName $BACKEND_HOST
              User ubuntu
              IdentityFile ~/.ssh/id_rsa
              ProxyJump bastion
              StrictHostKeyChecking no
          EOF
          
          chmod 600 ~/.ssh/config
          echo "✅ SSH config created"
      
      - name: Transfer Docker images via Bastion
        run: |
          echo "📤 Transferring Docker images via Bastion..."
          scp ${{ env.DOCKER_TAR_FILE }} backend:/home/ubuntu/
          echo "✅ Transfer completed"
      
      - name: Deploy on Backend EC2
        env:
          BACKEND_HOST: ${{ secrets.BACKEND_PRIVATE_IP }}
        run: |
          echo "🚀 Deploying to Backend EC2..."
          
          ssh backend << 'ENDSSH'
            set -e
            
            echo "📦 Loading Docker images..."
            cd /home/ubuntu
            gunzip -c all-images.tar.gz | docker load
            
            echo "🔄 Stopping existing containers..."
            cd /home/ubuntu/finlapor
            docker compose -f docker-compose.production.yml down || true
            
            echo "🚀 Starting new containers..."
            docker compose -f docker-compose.production.yml up -d
            
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            echo "🧹 Cleaning up..."
            rm -f /home/ubuntu/all-images.tar.gz
            docker image prune -f
            
            echo "✅ Backend deployment completed!"
          ENDSSH
      
      - name: Health Check
        run: |
          echo "🏥 Running health check..."
          
          for i in {1..10}; do
            HEALTH=$(ssh backend "curl -sf http://localhost:8080/health || echo 'failed'")
            if [[ "$HEALTH" != "failed" ]]; then
              echo "✅ Health check passed!"
              echo "Response: $HEALTH"
              exit 0
            fi
            echo "⏳ Attempt $i/10 - Waiting for backend to be healthy..."
            sleep 10
          done
          
          echo "❌ Health check failed after 10 attempts"
          exit 1

  # =====================================================
  # Job 3: Deploy Frontend to CloudFlare Pages
  # =====================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
        run: npm run build
      
      - name: Deploy to CloudFlare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "☁️ Deploying to CloudFlare Pages..."
          npm install -g wrangler
          cd frontend
          npx wrangler pages deploy out --project-name finlapor --branch production
          echo "✅ Frontend deployed to CloudFlare Pages!"

  # =====================================================
  # Job 4: Notify on Completion
  # =====================================================
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Send notification
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          VERSION="${{ github.ref_name }}"
          BACKEND_STATUS="${{ needs.deploy-backend.result }}"
          FRONTEND_STATUS="${{ needs.deploy-frontend.result }}"
          
          if [[ "$BACKEND_STATUS" == "success" && "$FRONTEND_STATUS" == "success" ]]; then
            EMOJI="✅"
            STATUS="SUCCESS"
            MESSAGE="Production deployment $VERSION completed successfully!"
          else
            EMOJI="❌"
            STATUS="FAILED"
            MESSAGE="Production deployment $VERSION failed! Backend: $BACKEND_STATUS, Frontend: $FRONTEND_STATUS"
          fi
          
          echo "$EMOJI $MESSAGE"
          
          # Send to Slack if webhook configured
          if [[ -n "$WEBHOOK_URL" ]]; then
            curl -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$EMOJI $MESSAGE\"}" || echo "Slack notification failed"
          fi

  # =====================================================
  # Job 5: Rollback on Failure
  # =====================================================
  rollback:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: failure()
    
    steps:
      - name: Setup SSH Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BACKEND_HOST: ${{ secrets.BACKEND_PRIVATE_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat >> ~/.ssh/config << EOF
          Host bastion
              HostName $BASTION_HOST
              User ubuntu
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
          
          Host backend
              HostName $BACKEND_HOST
              User ubuntu
              IdentityFile ~/.ssh/id_rsa
              ProxyJump bastion
              StrictHostKeyChecking no
          EOF
          
          chmod 600 ~/.ssh/config
      
      - name: Rollback to previous version
        run: |
          echo "⚠️ Deployment failed, initiating rollback..."
          
          ssh backend << 'ENDSSH'
            echo "🔄 Rolling back to previous Docker images..."
            cd /home/ubuntu/finlapor
            
            # Try to restart with previous images
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up -d
            
            echo "✅ Rollback completed"
          ENDSSH
