service: finlapor-ai-service

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.11
  region: ap-southeast-1
  memorySize: 512
  timeout: 60
  environment:
    HF_TOKEN: ${env:HF_TOKEN, ''}
    HF_OCR_MODEL: ${env:HF_OCR_MODEL, 'naver-clova-ix/donut-base-finetuned-cord-v2'}
    HF_LLM_MODEL: ${env:HF_LLM_MODEL, 'mistralai/Mistral-7B-Instruct-v0.2'}

functions:
  ai:
    handler: lambda_function.lambda_handler
    description: "FinLapor AI Service - OCR, Chat, Categorize, Insights"
    events:
      - http:
          path: /ai/{action}
          method: post
          cors: true
      - http:
          path: /ai/health
          method: get
          cors: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: non-linux
