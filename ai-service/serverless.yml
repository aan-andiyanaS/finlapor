service: finlapor-ai-service

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: ap-southeast-1
  memorySize: 512
  timeout: 30
  environment:
    HF_TOKEN: ${env:HF_TOKEN}

functions:
  main:
    handler: lambda_function.lambda_handler
    events:
      - http:
          path: /
          method: post
          cors: true
      - http:
          path: /health
          method: get
          cors: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: non-linux
